<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📂 الأقسام | WebCraft Menu</title>
    <link rel="icon" href="logo.png" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>

    <!-- Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAUPH5CuY34ZmNlpGA1XrsFreLHSevjgfQ",
        authDomain: "menuapp-9f554.firebaseapp.com",
        projectId: "menuapp-9f554",
        storageBucket: "menuapp-9f554.appspot.com",
        messagingSenderId: "232255681174",
        appId: "1:232255681174:web:bdc5bfb0ff8df988c348b7",
      };

      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
    </script>
  </head>
  <body>
    <header>
      <img src="logo.png" alt="شعار" />
      <h1>📂 أقسام المنيو</h1>
    </header>

    <div class="container" id="sections-container">
      <p>⏳ جارٍ تحميل الأقسام...</p>
    </div>

    <script type="module">
      import {
        getDocs,
        collection,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const container = document.getElementById("sections-container");
      const db = window.db;

      const loadSections = async () => {
        const snapshot = await getDocs(collection(db, "menu"));
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = "<p>لا توجد أقسام حتى الآن.</p>";
          return;
        }

        snapshot.forEach((doc) => {
          const section = doc.id;
          const btn = document.createElement("button");
          btn.textContent = section;
          btn.className = "section-button";
          btn.onclick = () =>
            (window.location.href = `menu.html?section=${encodeURIComponent(
              section
            )}`);
          container.appendChild(btn);
        });
      };

      loadSections();
    </script>
  </body>
</html>
