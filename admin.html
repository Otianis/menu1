<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎛️ لوحة تحكم المالك | WebCraft</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        doc,
        deleteDoc,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAUPH5CuY34ZmNlpGA1XrsFreLHSevjgfQ",
        authDomain: "menuapp-9f554.firebaseapp.com",
        projectId: "menuapp-9f554",
        storageBucket: "menuapp-9f554.appspot.com",
        messagingSenderId: "232255681174",
        appId: "1:232255681174:web:bdc5bfb0ff8df988c348b7",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.db = db;
      window.firestoreFns = {
        collection,
        addDoc,
        getDocs,
        doc,
        deleteDoc,
        updateDoc,
      };
    </script>
  </head>
  <body>
    <header>
      <img src="logo.png" alt="شعار WebCraft" />
      <h1>🎛️ لوحة تحكم المالك</h1>
    </header>

    <div class="container">
      <div class="form-section" id="form-top">
        <h2>➕ إضافة قسم / منتج جديد</h2>
        <input id="section" placeholder="اسم القسم (مثلاً: مشروبات)" required />
        <input
          id="name"
          placeholder="اسم المنتج (مثلاً: عصير مانجو)"
          required
        />
        <textarea id="desc" placeholder="وصف المنتج"></textarea>
        <input id="price" placeholder="السعر بالدينار" type="number" required />
        <input id="img" type="file" accept="image/*" />
        <button onclick="addProduct()">➕ إضافة إلى المنيو</button>
      </div>

      <div class="menu-section">
        <h2>📋 قائمة المنتجات</h2>
        <div id="menu-list"></div>
      </div>
    </div>
  </body>
</html>
